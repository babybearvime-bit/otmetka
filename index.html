<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Приложение «Отметка»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: мобильное приложение в одну колонку до 860px; липкая шапка (назад · объект · колокольчик · профиль); главная — плитки разделов по должности; ленты связи с липкой строкой ввода снизу. */
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --sunk:#E9EDF2; --ink:#1B2430; --muted:#5E6B7A; --line:#DCE1E8;
  --accent:#2160A8; --accent-ink:#FFFFFF; --accent-soft:#E4EDF8;
  --open:#B3261E; --open-ink:#FFFFFF; --open-soft:#FBE5E3;
  --done:#1F8A4C; --done-ink:#FFFFFF; --done-soft:#E2F3E9;
  --warn:#B4630A; --warn-ink:#FFFFFF; --warn-soft:#FBEEDC;
  --me:#2160A8; --me-ink:#FFFFFF;
  --plan-bg:#FFFFFF; --plan-filter:none; --dot:rgba(33,96,168,.38);
  --za:rgba(214,138,24,.10); --za-b:#C47F12; --zb:rgba(33,96,168,.08); --zb-b:#2160A8; --zc:rgba(31,138,76,.09); --zc-b:#1F8A4C;
  --shadow:0 6px 18px rgba(20,30,45,.16);
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --code:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --card:#18202A; --sunk:#131A22; --ink:#E6ECF2; --muted:#93A1B1; --line:#2A3542;
  --accent:#6FA8EC; --accent-ink:#0E1620; --accent-soft:#1C2E44;
  --open:#F08A80; --open-ink:#2A0E0B; --open-soft:#3D1E1C; --done:#5BC98A; --done-ink:#0B2414; --done-soft:#173326;
  --warn:#E8A452; --warn-ink:#2A1A05; --warn-soft:#3A2A15; --me:#2D5E96; --me-ink:#F2F6FA;
  --plan-bg:#12171D; --plan-filter:invert(.9) hue-rotate(180deg); --dot:rgba(111,168,236,.5);
  --za:rgba(240,170,60,.12); --za-b:#F0B65A; --zb:rgba(111,168,236,.10); --zb-b:#6FA8EC; --zc:rgba(91,201,138,.10); --zc-b:#5BC98A;
  --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --card:#18202A; --sunk:#131A22; --ink:#E6ECF2; --muted:#93A1B1; --line:#2A3542;
  --accent:#6FA8EC; --accent-ink:#0E1620; --accent-soft:#1C2E44;
  --open:#F08A80; --open-ink:#2A0E0B; --open-soft:#3D1E1C; --done:#5BC98A; --done-ink:#0B2414; --done-soft:#173326;
  --warn:#E8A452; --warn-ink:#2A1A05; --warn-soft:#3A2A15; --me:#2D5E96; --me-ink:#F2F6FA;
  --plan-bg:#12171D; --plan-filter:invert(.9) hue-rotate(180deg); --dot:rgba(111,168,236,.5);
  --za:rgba(240,170,60,.12); --za-b:#F0B65A; --zb:rgba(111,168,236,.10); --zb-b:#6FA8EC; --zc:rgba(91,201,138,.10); --zc-b:#5BC98A;
  --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:1rem/1.45 var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.app>*{min-width:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:0}
.ico{display:inline-flex;flex:none}
/* шапка */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column}
.bt b{font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt small{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;padding:0}
.dotn{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:999px;background:var(--open);color:var(--open-ink);font:700 .7rem/19px var(--ui);padding:0 5px;text-align:center}
.av{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;display:grid;place-items:center;flex:none;padding:0}
.av.sm{width:34px;height:34px;font-size:.78rem}
.objsel{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-weight:700;font-size:1.12rem;padding:0 22px 0 0;max-width:100%;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.objwrap{position:relative}
.objbtn{display:inline-flex;align-items:center;gap:4px;max-width:100%;border:0;background:transparent;color:var(--ink);font:inherit;padding:2px 6px 2px 0;border-radius:10px;cursor:pointer;min-height:0}
.objbtn b{font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.objbtn .ico{color:var(--muted);transition:transform .15s;flex:none}
.objbtn[aria-expanded="true"] .ico{transform:rotate(180deg)}
.objmenu{position:absolute;top:calc(100% + 8px);left:0;z-index:20;width:max-content;min-width:250px;max-width:min(340px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px}
.objmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px;border-radius:12px;cursor:pointer;min-height:0}
.objmenu button:hover{background:var(--sunk)}
.objmenu button[aria-selected="true"]{background:var(--accent-soft)}
.objmenu button[aria-selected="true"]>.ico{color:var(--accent)}
.objmenu .grow{min-width:0;flex:1;display:flex;flex-direction:column}
.objmenu .grow span{color:var(--muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select option{background:var(--card);color:var(--ink)}
/* общие */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.hint{font-size:.84rem;color:var(--muted)}
.demo{font-size:.82rem;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grow{flex:1;min-width:0}
.primary{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:13px 16px;font-size:1rem;text-align:center}
.primary:disabled{opacity:.45;cursor:default}
.ok{border:0;background:var(--done);color:var(--done-ink);font-weight:700;border-radius:12px;padding:13px 16px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;font-weight:600;text-align:center}
.danger{border:1px solid var(--open);background:transparent;color:var(--open);border-radius:12px;padding:11px 14px;font-weight:600}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;text-align:left}
.item b.what{white-space:pre-line;font-size:1.02rem;line-height:1.3}
.link.inl{margin-left:10px;padding:0;font-size:.9em}
.sm{padding:7px 11px;font-size:.88rem;border-radius:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:.88rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-family:var(--code);font-size:.8em;margin-left:5px;opacity:.75}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:.9rem}
.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px}
textarea.in{min-height:84px;resize:vertical}
.err{color:var(--open);font-size:.9rem;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.p-open{background:var(--open-soft);color:var(--open)}
.p-done{background:var(--done-soft);color:var(--done)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-grey{background:var(--sunk);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.sec-t{font:600 .74rem var(--code);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:.94rem;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.code{font-family:var(--code);font-weight:600}
/* главная */
.hello{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.hello b{font-size:1.35rem}
.bigbtn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;display:flex;gap:10px;align-items:center;justify-content:center;font-weight:700;font-size:1.05rem;box-shadow:var(--shadow)}
.attn{display:flex;flex-direction:column;gap:6px}
.attn button{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:.92rem}
.attn .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:104px}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .lb{font-weight:600;line-height:1.2}
.tile .vw{position:absolute;top:10px;right:10px;font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.tile .bd{position:absolute;top:10px;right:10px;min-width:22px;height:22px;border-radius:999px;background:var(--open);color:var(--open-ink);font:700 .75rem/22px var(--ui);text-align:center;padding:0 6px}
.tiles.few{grid-template-columns:1fr 1fr}
.tiles.few .tile{min-height:140px}.tiles.few .tile .lb{font-size:1.1rem}.tiles.few .tile .ic{width:54px;height:54px}
/* списки */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:78px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.item img,.thumb{width:78px;height:78px;border-radius:9px;object-fit:cover;background:var(--sunk)}
.item .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.room{font-family:var(--code);font-weight:600;font-size:.86rem}
.room span{font-family:var(--ui);font-weight:600;font-size:.95rem;margin-left:6px}
.txt{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;width:100%}
.li .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .body b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .body span{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.75rem;color:var(--muted);flex:none}
.cnt{min-width:21px;height:21px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 .72rem/21px var(--ui);text-align:center;padding:0 6px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos.one{grid-template-columns:1fr}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--sunk);display:block}
.ph span{position:absolute;left:8px;top:8px;background:rgba(15,20,28,.72);color:#fff;font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 9px}
.picker{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;background:var(--card);padding:18px;text-align:center;color:var(--muted);font-weight:500;cursor:pointer}
.picker img{max-width:100%;max-height:240px;border-radius:10px}
.picker input{position:absolute;width:1px;height:1px;opacity:0}
.hist{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.hist div{display:grid;grid-template-columns:12px 1fr;gap:10px}
.hist i{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:5px}
.hist i.r{background:var(--open)}.hist i.g{background:var(--done)}.hist i.y{background:var(--warn)}
/* план */
.planwrap{position:relative}
.planbox{position:relative;overflow:auto;height:min(58vh,520px);background:var(--plan-bg);border:1px solid var(--line);border-radius:14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.planin{position:relative}
.planin img{position:absolute;inset:0;width:100%;height:100%;max-width:none;filter:var(--plan-filter);user-select:none;-webkit-user-drag:none;pointer-events:none}
.zone{position:absolute;border:2px dashed;border-radius:6px;pointer-events:none}
.z0{background:var(--za);border-color:var(--za-b)}.z1{background:var(--zb);border-color:var(--zb-b)}.z2{background:var(--zc);border-color:var(--zc-b)}
.zl{position:absolute;pointer-events:auto;transform:translateY(-50%);border:2px solid;background:var(--card);border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;white-space:nowrap;z-index:2}
.zl.z0{border-color:var(--za-b)}.zl.z1{border-color:var(--zb-b)}.zl.z2{border-color:var(--zc-b)}
.zl small{font-weight:500;color:var(--muted);margin-left:4px}
.planin.compact .zl small{display:none}
.rm{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border:0;background:none;padding:0;display:grid;place-items:center;z-index:1}
.rm::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--dot)}
.rm.has::after{display:none}
.rm .b{min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font:700 .76rem/1 var(--code);padding:0 6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.rm.o .b{background:var(--open);color:var(--open-ink)}.rm.f .b{background:var(--warn);color:var(--warn-ink)}.rm.a .b{background:var(--done);color:var(--done-ink)}
.rm.sel{outline:3px solid var(--ink);outline-offset:1px;border-radius:999px;z-index:3;animation:pulse 1.6s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--open) 70%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
.minicard{gap:8px}
.mini-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini-h h3{margin:0}
.mini{position:relative;display:block;width:100%;height:190px;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--plan-bg);cursor:pointer}
.mini .planin{position:absolute;left:0;top:0}
.spot{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:var(--open);border:3px solid #fff;box-shadow:0 0 0 2px var(--open);animation:pulse 1.6s ease-out infinite;z-index:2}
.mini-l{position:absolute;left:8px;bottom:8px;background:var(--card);color:var(--ink);font-size:.78rem;font-weight:600;padding:3px 8px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:reduce){.spot,.rm.sel{animation:none}}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:1.15rem;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.sw{width:14px;height:14px;border-radius:4px;border:2px solid;flex:none}
/* связь */
.feed{display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
.day{align-self:center;font-size:.75rem;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 10px}
.msg{max-width:82%;padding:8px 11px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-break:break-word}
.msg .who{font-size:.74rem;font-weight:600;color:var(--accent);display:block}
.msg small{display:block;font-size:.68rem;opacity:.7;margin-top:2px;text-align:right}
.msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-color:transparent}
.msg.me .who{display:none}
.msg img{max-width:220px;border-radius:10px;display:block;margin-top:4px}
.fc{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.fc .k{display:flex;gap:6px;align-items:center;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.fc.rem{border-left:4px solid var(--open)}.fc.rem .k{color:var(--open)}
.fc.fix{border-left:4px solid var(--warn)}.fc.fix .k{color:var(--warn)}
.fc.acc{border-left:4px solid var(--done)}.fc.acc .k{color:var(--done)}
.fc.hrs{border-left:4px solid var(--accent)}.fc.hrs .k{color:var(--accent)}
.fc .t{font-weight:600}
.fc .s{font-size:.82rem;color:var(--muted)}
.compose{position:sticky;bottom:0;background:var(--bg);padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.compose .r{display:flex;gap:8px;align-items:center}
.compose input[type=text]{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:10px 14px}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;padding:0;position:relative}
.round.soft{background:var(--accent-soft);color:var(--accent)}
.round input{position:absolute;inset:0;opacity:0;cursor:pointer}
.acts{display:flex;gap:6px}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:.82rem;font-weight:600;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 4px}
/* часы */
.hrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.hrow .nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:4px 0;font-weight:600}

<script>
(() => {
'use strict';
/* ===== данные чертежей (из рабочего приложения) ===== */
// Демо-план для показа другим компаниям: вымышленный жилой дом, нарисован с нуля (не чертежи клиента).
// Код помещения: этаж.квартира.комната. Корпус 1: секции 2.4 | 2.5 | 2.6, по 2 квартиры в секции + холл (группа 7).
// Корпус 2: секции 5.2 | 5.1, по 2 квартиры + холл (группа 5).
const NEUTRAL_PLAN = (() => {
  const VW = 1000, VH = 460;
  const ROOMN = ['Прихожая', 'Кухня-гостиная', 'Спальня', 'Санузел'];
  const area = (seed, a, b) => { let x = 0; for (const c of seed) x = (x * 31 + c.charCodeAt(0)) % 997; return +(a + (x / 997) * (b - a)).toFixed(2); };
  function building(secs, mopGroup) {
    // secs: массив id секций слева направо
    const x0 = 4, x1 = 96, yT = 12, yM = 66, yB = 90, w = (x1 - x0) / secs.length;
    const zones = [], cut = [], rooms = {}, svg = [];
    const P = (x, y) => [x / 100 * VW, y / 100 * VH];
    const rect = (ax, ay, bx, by, cls) => { const [X, Y] = P(ax, ay), [X2, Y2] = P(bx, by); svg.push(`<rect x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${(X2 - X).toFixed(1)}" height="${(Y2 - Y).toFixed(1)}" class="${cls}"/>`); };
    const text = (x, y, t, cls) => { const [X, Y] = P(x, y); svg.push(`<text x="${X.toFixed(1)}" y="${Y.toFixed(1)}" class="${cls}">${t}</text>`); };
    secs.forEach((sec, i) => {
      const sx = x0 + i * w; zones.push({ sec, x0: sx, x1: sx + w, y0: yT - 2, y1: yB + 2 }); if (i) cut.push(+sx.toFixed(2));
      for (let j = 0; j < 2; j++) {
        const fx = sx + j * w / 2, fw = w / 2, flat = i * 2 + j + 1, mid = yT + (yM - yT) * .58;
        // кухня (2) и спальня (3) сверху, прихожая (1) и санузел (4) снизу
        const cells = j === 0
